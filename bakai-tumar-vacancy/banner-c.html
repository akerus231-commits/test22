<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2400">
<title>Тумар — вакансия, вариант C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Noto+Sans+Old+Turkic&display=block" rel="stylesheet">
<style>
  /* Вариант C «Минимал по центру»: тёмный фон, синее свечение за
     словом «менеджер», руны рамкой сверху и снизу. */
  :root {
    --bg: #060C1E;
    --bg-2: #0A1838;
    --blue: #2169DE;
    --blue-hi: #3D82F5;
    --blue-glow: rgba(33, 105, 222, 0.6);
    --ink: #FFFFFF;
    --muted: #AEBBD6;
    --line: rgba(120, 160, 255, 0.2);
    --font: "Montserrat", Arial, sans-serif;
    --runes: "Noto Sans Old Turkic", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #8C929A; }
  body {
    display: flex;
    align-items: flex-start;
    gap: 80px;
    padding: 40px;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .ad {
    position: relative;
    flex: none;
    width: 1080px;
    overflow: hidden;
    color: var(--ink);
    text-align: center;
    background:
      radial-gradient(700px 520px at 50% var(--glow-y), rgba(33, 105, 222, 0.55) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  }
  .ad[data-format="feed"] {
    height: 1350px;
    --pad-top: 116px;
    --pad-bottom: 140px;
    --h1: 72px;
    --word: 136px;
    --gap: 28px;
    --glow-y: 420px;
    --runes-edge: 18px;
  }
  .ad[data-format="story"] {
    height: 1920px;
    --pad-top: 240px;
    --pad-bottom: 320px;
    --h1: 84px;
    --word: 160px;
    --gap: 48px;
    --glow-y: 640px;
    --runes-edge: 48px;
  }

  .ad__inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
    padding: var(--pad-top) 80px var(--pad-bottom);
  }

  .runes {
    position: absolute;
    z-index: 1;
    left: -40px;
    right: -40px;
    font-family: var(--runes);
    font-size: 56px;
    letter-spacing: 28px;
    white-space: nowrap;
    color: #6F86C0;
    opacity: 0.22;
  }
  .runes--top { top: var(--runes-edge); }
  .runes--bottom { bottom: var(--runes-edge); }

  .brand { display: flex; align-items: baseline; gap: 18px; }
  .brand__name { font-weight: 700; font-size: 44px; letter-spacing: -1px; }
  .brand__x { font-weight: 500; font-size: 26px; color: var(--muted); }
  .brand__bank { font-weight: 700; font-size: 22px; letter-spacing: 3px; color: var(--muted); }

  .overline {
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    color: var(--muted);
  }

  h1 {
    font-weight: 700;
    font-size: var(--h1);
    line-height: 1.05;
    letter-spacing: -1px;
  }
  h1 em {
    display: block;
    font-style: normal;
    font-weight: 800;
    font-size: var(--word);
    line-height: 1.05;
    letter-spacing: -4px;
    margin: 6px 0;
    background: linear-gradient(180deg, #FFFFFF 10%, #8DB4FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 40px var(--blue-glow));
  }

  .salary {
    display: inline-flex;
    align-items: baseline;
    gap: 18px;
    padding: 18px 40px;
    border-radius: 100px;
    border: 2px solid var(--blue-hi);
    box-shadow: 0 0 40px var(--blue-glow), inset 0 0 30px rgba(33, 105, 222, 0.25);
  }
  .salary__sum { font-weight: 800; font-size: 60px; letter-spacing: -1px; }
  .salary__note { font-style: italic; font-weight: 500; font-size: 30px; color: var(--muted); }

  .perks {
    list-style: none;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .perk {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px 14px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--line);
    font-weight: 600;
    font-size: 23px;
    line-height: 1.25;
  }
  .ad[data-format="story"] .perks { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .ad[data-format="story"] .perk { font-size: 28px; padding: 28px 18px; }
  .perk svg {
    width: 44px;
    height: 44px;
    color: var(--blue-hi);
    filter: drop-shadow(0 0 12px var(--blue-glow));
  }

  .cta {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .cta__text { font-style: italic; font-weight: 600; font-size: 32px; }
  .cta__btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 56px;
    border-radius: 100px;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    box-shadow: 0 0 50px var(--blue-glow);
    font-weight: 700;
    font-size: 28px;
  }
  .cta__btn svg { width: 28px; height: 28px; }
</style>
</head>
<body>

<template id="tpl">
  <div class="runes runes--top" aria-hidden="true">𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰 𐰋𐰃𐰠𐰏𐰀 𐰉𐰆𐰑𐰣 𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰 𐰋𐰃𐰠𐰏𐰀</div>
  <div class="runes runes--bottom" aria-hidden="true">𐰉𐰆𐰑𐰣 𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰 𐰋𐰃𐰠𐰏𐰀 𐰉𐰆𐰑𐰣 𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰</div>
  <div class="ad__inner">
    <div class="brand">
      <span class="brand__name">тумар</span>
      <span class="brand__x">×</span>
      <span class="brand__bank">BAKAI BANK</span>
    </div>

    <p class="overline">Чоң мүмкүнчүлүктөр — бирге!</p>
    <h1>Сатуу бөлүмүнө <em>менеджер</em> керек</h1>

    <div class="salary">
      <span class="salary__sum">100 000+ сом</span>
      <span class="salary__note">айлык акы</span>
    </div>

    <ul class="perks">
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
        <span>Расмий жумушка орноштуруу</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
        <span>Толук жумуш менен камсыздоо</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>5/2<br>9:00–18:00</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Жол жүрүп иштөө мүнөзү</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l-3.5 2 1-4-3-2.7 4-.3L12 6l1.5 4 4 .3-3 2.7 1 4z"/></svg>
        <span>Тажрыйба 1 жылдан — артыкчылык</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span>Карьералык өсүү мүмкүнчүлүгү</span>
      </li>
    </ul>

    <div class="cta">
      <div class="cta__text">Карьераңды жогорку деңгээлге көтөр!</div>
      <div class="cta__btn">
        Директке жаз
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</template>

<section class="ad" data-format="feed" data-name="vacancy-c-1080x1350"></section>
<section class="ad" data-format="story" data-name="vacancy-c-1080x1920"></section>

<script>
  const tpl = document.getElementById('tpl');
  document.querySelectorAll('section.ad').forEach((ad) => ad.appendChild(tpl.content.cloneNode(true)));
  window.checkFit = () => [...document.querySelectorAll('section.ad')]
    .filter((ad) => {
      const inner = ad.querySelector('.ad__inner');
      return inner.scrollHeight > inner.clientHeight;
    })
    .map((ad) => ad.dataset.name);
</script>
</body>
</html>

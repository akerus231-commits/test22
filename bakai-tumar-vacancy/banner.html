<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2400">
<title>Тумар — вакансия менеджера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Noto+Sans+Old+Turkic&display=block" rel="stylesheet">
<style>
  /* Палитра снята с рекламы «Тумар × Toolor»: глубокий синий фон,
     синее свечение, белый и серебристый текст. */
  :root {
    --bg-glow: #012572;
    --bg: #0A1838;
    --bg-deep: #060C1E;
    --ink: #FFFFFF;
    --muted: #AEBBD6;
    --silver: #C9CDD4;
    --blue: #2169DE;
    --blue-hi: #3D82F5;
    --blue-glow: rgba(33, 105, 222, 0.55);
    --tile: rgba(255, 255, 255, 0.05);
    --tile-line: rgba(120, 160, 255, 0.18);
    --font: "Montserrat", Arial, sans-serif;
    --runes: "Noto Sans Old Turkic", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #8C929A; }
  body {
    display: flex;
    align-items: flex-start;
    gap: 80px;
    padding: 40px;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Форматы ----------
     feed  1080×1350 — лента 4:5, поля 80px.
     story 1080×1920 — Stories/Reels: сверху ~220px занимают аватар и
     прогресс-бар, снизу ~300px — кнопка рекламы; контент между ними. */
  .ad {
    position: relative;
    flex: none;
    width: 1080px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(900px 800px at 0% 0%, var(--bg-glow) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .ad[data-format="feed"] {
    height: 1350px;
    --pad-x: 80px;
    --pad-top: 72px;
    --pad-bottom: 72px;
    --h1: 92px;
    --gap: 30px;
    --runes-top: 590px;
    --photo-top: 40px;
    --photo-w: 660px;
  }
  .ad[data-format="story"] {
    height: 1920px;
    --pad-x: 80px;
    --pad-top: 220px;
    --pad-bottom: 300px;
    --h1: 104px;
    --gap: 48px;
    --runes-top: 1700px;
    --photo-top: 200px;
    --photo-w: 720px;
  }

  .ad__inner {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  }

  /* ---------- Фото: справа от заголовка, растворяется в фоне ---------- */
  .photo {
    position: absolute;
    z-index: 1;
    right: -60px;
    top: var(--photo-top);
    width: var(--photo-w);
    -webkit-mask-image:
      linear-gradient(to bottom, transparent 0%, #000 14%, #000 62%, transparent 96%),
      linear-gradient(to right, transparent 0%, #000 22%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, transparent 0%, #000 14%, #000 62%, transparent 96%),
      linear-gradient(to right, transparent 0%, #000 22%);
    mask-composite: intersect;
  }

  /* ---------- Руны — полоса орнамента, как на рекламе карты ---------- */
  .runes {
    position: absolute;
    z-index: 1;
    left: -40px;
    right: -40px;
    top: var(--runes-top);
    font-family: var(--runes);
    font-size: 96px;
    letter-spacing: 34px;
    white-space: nowrap;
    color: #6F86C0;
    opacity: 0.16;
  }

  /* ---------- Шапка ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .brand__name {
    font-weight: 700;
    font-size: 52px;
    letter-spacing: -1px;
  }
  .brand__x {
    font-weight: 500;
    font-size: 30px;
    color: var(--muted);
  }
  .brand__bank {
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--silver);
  }
  .tag {
    padding: 14px 28px;
    border-radius: 100px;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 1px;
  }

  /* ---------- Заголовок ---------- */
  .overline {
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    color: var(--muted);
  }
  h1 {
    font-weight: 700;
    font-size: var(--h1);
    line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 780px;
    text-shadow: 0 6px 30px rgba(6, 12, 30, 0.7);
  }
  h1 em {
    display: inline-block;
    font-style: normal;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    padding: 0 24px 10px;
    margin: 8px 0 4px -4px;
    border-radius: 20px;
    box-shadow: 0 0 60px var(--blue-glow);
    text-shadow: none;
  }

  /* ---------- Зарплата ---------- */
  .salary {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .salary__sum {
    font-weight: 700;
    font-size: 92px;
    line-height: 1;
    letter-spacing: -2px;
    white-space: nowrap;
    text-shadow: 0 0 40px rgba(61, 130, 245, 0.6);
  }
  .salary__sum small {
    font-size: 46px;
    letter-spacing: 0;
    color: var(--silver);
  }
  .salary__note {
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    color: var(--muted);
    border-left: 2px solid var(--tile-line);
    padding-left: 24px;
  }

  /* ---------- Условия ---------- */
  .perks {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .perk {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-radius: 22px;
    background: var(--tile);
    border: 1.5px solid var(--tile-line);
    backdrop-filter: blur(8px);
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
  }
  .perk svg {
    flex: none;
    width: 52px;
    height: 52px;
    padding: 12px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    box-shadow: 0 0 24px var(--blue-glow);
    color: #FFFFFF;
  }
  .perk b { font-weight: 700; color: #8DB4FF; }

  /* ---------- Призыв ---------- */
  .cta {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 26px 26px 26px 36px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid var(--tile-line);
    backdrop-filter: blur(8px);
  }
  .cta__text {
    font-style: italic;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.2;
  }
  .cta__btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 32px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    box-shadow: 0 0 40px var(--blue-glow);
    font-weight: 700;
    font-size: 27px;
    white-space: nowrap;
  }
  .cta__btn svg { width: 28px; height: 28px; }
</style>
</head>
<body>

<template id="tpl">
  <img class="photo" src="photo/manager.jpg" alt="">
  <div class="runes" aria-hidden="true">𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰 𐰋𐰃𐰠𐰏𐰀 𐰉𐰆𐰑𐰣 𐰴𐰆𐰺𐰍𐰃𐰕 𐱅𐰇𐰼𐰰</div>
  <div class="ad__inner">
    <div class="top">
      <div class="brand">
        <span class="brand__name">тумар</span>
        <span class="brand__x">×</span>
        <span class="brand__bank">BAKAI BANK</span>
      </div>
      <div class="tag">Вакансия</div>
    </div>

    <p class="overline">Чоң мүмкүнчүлүктөр — бирге!</p>
    <h1>Сатуу бөлүмүнө <em>менеджер</em> керек</h1>

    <div class="salary">
      <div class="salary__sum">100 000+ <small>сом</small></div>
      <div class="salary__note">айлык<br>акы</div>
    </div>

    <ul class="perks">
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
        <span>Расмий жумушка орноштуруу</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
        <span>Толук жумуш менен камсыздоо</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>График <b>5/2</b>, <b>9:00–18:00</b></span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Жол жүрүп иштөө мүнөзү</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l-3.5 2 1-4-3-2.7 4-.3L12 6l1.5 4 4 .3-3 2.7 1 4z"/></svg>
        <span>Тажрыйба <b>1 жылдан</b> ашык болсо — артыкчылык</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span>Карьералык өсүү мүмкүнчүлүгү</span>
      </li>
    </ul>

    <div class="cta">
      <div class="cta__text">Карьераңды жогорку<br>деңгээлге көтөр!</div>
      <div class="cta__btn">
        Директке жаз
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</template>

<section class="ad" data-format="feed" data-name="vacancy-1080x1350"></section>
<section class="ad" data-format="story" data-name="vacancy-1080x1920"></section>

<script>
  // Один шаблон на оба формата — текст правится в одном месте.
  const tpl = document.getElementById('tpl');
  document.querySelectorAll('section.ad').forEach((ad) => ad.appendChild(tpl.content.cloneNode(true)));

  // Флаг для экспорта: контент не должен вылезать за нижнее безопасное поле.
  window.checkFit = () => [...document.querySelectorAll('section.ad')]
    .filter((ad) => {
      const inner = ad.querySelector('.ad__inner');
      return inner.scrollHeight > inner.clientHeight;
    })
    .map((ad) => ad.dataset.name);
</script>
</body>
</html>

<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2400">
<title>Тумар — вакансия менеджера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  /* Цвета вынесены в переменные: под брендбук банка достаточно поменять их. */
  :root {
    --bg: #0B1F3A;
    --bg-2: #123563;
    --ink: #FFFFFF;
    --muted: #B9C6DA;
    --accent: #FFC93C;
    --accent-ink: #0B1F3A;
    --card-a: #1E5BB8;
    --card-b: #0E2E5C;
    --tile: rgba(255, 255, 255, 0.07);
    --tile-line: rgba(255, 255, 255, 0.14);
    --font: "Montserrat", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #8C929A; }
  body {
    display: flex;
    align-items: flex-start;
    gap: 80px;
    padding: 40px;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Форматы ----------
     feed  1080×1350 — лента 4:5, поля 80px.
     story 1080×1920 — Stories/Reels: сверху ~250px занимают аватар и
     прогресс-бар, снизу ~340px — кнопка рекламы; контент между ними. */
  .ad {
    position: relative;
    flex: none;
    width: 1080px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(900px 700px at 100% 0%, var(--bg-2) 0%, transparent 70%),
      radial-gradient(700px 600px at 0% 100%, #0F2A50 0%, transparent 70%),
      var(--bg);
  }
  .ad[data-format="feed"] {
    height: 1350px;
    --pad-x: 80px;
    --pad-top: 72px;
    --pad-bottom: 72px;
    --h1: 96px;
    --gap: 28px;
  }
  .ad[data-format="story"] {
    height: 1920px;
    --pad-x: 80px;
    --pad-top: 220px;
    --pad-bottom: 300px;
    --h1: 112px;
    --gap: 48px;
  }

  .ad__inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  }

  /* ---------- Фоновая карта «Тумар» ---------- */
  .card {
    position: absolute;
    z-index: 1;
    width: 620px;
    height: 390px;
    border-radius: 36px;
    background: linear-gradient(135deg, var(--card-a) 0%, var(--card-b) 100%);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.12);
    transform: rotate(-18deg);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: -40% -10% auto auto;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 201, 60, 0.35), transparent 65%);
  }
  .card__chip {
    position: absolute;
    left: 56px;
    top: 120px;
    width: 92px;
    height: 70px;
    border-radius: 14px;
    background: linear-gradient(135deg, #F4D27A, #C99A2E);
  }
  .card__name {
    position: absolute;
    left: 56px;
    top: 44px;
    font-weight: 900;
    font-size: 46px;
    letter-spacing: 6px;
  }
  .card__num {
    position: absolute;
    left: 56px;
    bottom: 60px;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 6px;
    color: rgba(255, 255, 255, 0.75);
  }
  .ad[data-format="feed"] .card { right: -330px; top: 110px; }
  .ad[data-format="story"] .card { right: -330px; top: 250px; }

  /* ---------- Шапка ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 1px;
  }
  .brand span { color: var(--accent); }
  .tag {
    padding: 14px 26px;
    border-radius: 100px;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 4px;
  }

  /* ---------- Заголовок ---------- */
  .overline {
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }
  h1 {
    font-weight: 900;
    font-size: var(--h1);
    line-height: 0.98;
    letter-spacing: -2px;
    text-transform: uppercase;
    max-width: 760px;
    text-shadow: 0 6px 30px rgba(11, 31, 58, 0.6);
  }
  h1 em {
    display: inline-block;
    font-style: normal;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 22px 10px;
    margin: 10px 0 6px -4px;
    border-radius: 18px;
    transform: rotate(-2deg);
  }

  /* ---------- Зарплата ---------- */
  .salary {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .salary__sum {
    font-weight: 900;
    font-size: 96px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -2px;
    white-space: nowrap;
  }
  .salary__sum small {
    font-size: 48px;
    letter-spacing: 0;
  }
  .salary__note {
    font-weight: 600;
    font-size: 28px;
    line-height: 1.25;
    color: var(--muted);
    border-left: 3px solid var(--tile-line);
    padding-left: 24px;
  }

  /* ---------- Условия ---------- */
  .perks {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .perk {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-radius: 22px;
    background: var(--tile);
    border: 1.5px solid var(--tile-line);
    backdrop-filter: blur(6px);
    font-weight: 700;
    font-size: 27px;
    line-height: 1.2;
  }
  .perk svg {
    flex: none;
    width: 52px;
    height: 52px;
    padding: 11px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .perk b { color: var(--accent); font-weight: 800; }

  /* ---------- Призыв ---------- */
  .cta {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 28px 28px 28px 36px;
    border-radius: 28px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .cta__text {
    font-weight: 900;
    font-size: 34px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .cta__btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 30px;
    border-radius: 18px;
    background: var(--accent-ink);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 26px;
    white-space: nowrap;
  }
  .cta__btn svg { width: 28px; height: 28px; }
</style>
</head>
<body>

<template id="tpl">
  <div class="card" aria-hidden="true">
    <div class="card__name">ТУМАР</div>
    <div class="card__chip"></div>
    <div class="card__num">•••• •••• •••• 2026</div>
  </div>
  <div class="ad__inner">
    <div class="top">
      <div class="brand">Бакай Банк <span>·</span> Тумар</div>
      <div class="tag">ВАКАНСИЯ</div>
    </div>

    <div>
      <p class="overline">Чоң мүмкүнчүлүктөр — бирге!</p>
    </div>
    <h1>Сатуу бөлүмүнө <em>менеджер</em> керек</h1>

    <div class="salary">
      <div class="salary__sum">100 000+ <small>сом</small></div>
      <div class="salary__note">айлык<br>акы</div>
    </div>

    <ul class="perks">
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
        <span>Расмий жумушка орноштуруу</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
        <span>Толук жумуш менен камсыздоо</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>График <b>5/2</b>, <b>9:00–18:00</b></span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Жол жүрүп иштөө мүнөзү</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l-3.5 2 1-4-3-2.7 4-.3L12 6l1.5 4 4 .3-3 2.7 1 4z"/></svg>
        <span>Тажрыйба <b>1 жылдан</b> ашык болсо — артыкчылык</span>
      </li>
      <li class="perk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span>Карьералык өсүү мүмкүнчүлүгү</span>
      </li>
    </ul>

    <div class="cta">
      <div class="cta__text">Карьераңды жогорку<br>деңгээлге көтөр!</div>
      <div class="cta__btn">
        Директке жаз
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</template>

<section class="ad" data-format="feed" data-name="vacancy-1080x1350"></section>
<section class="ad" data-format="story" data-name="vacancy-1080x1920"></section>

<script>
  // Один шаблон на оба формата — текст правится в одном месте.
  const tpl = document.getElementById('tpl');
  document.querySelectorAll('section.ad').forEach((ad) => ad.appendChild(tpl.content.cloneNode(true)));

  // Флаг для экспорта: контент не должен вылезать за нижнее безопасное поле.
  window.checkFit = () => [...document.querySelectorAll('section.ad')]
    .filter((ad) => {
      const inner = ad.querySelector('.ad__inner');
      return inner.scrollHeight > inner.clientHeight;
    })
    .map((ad) => ad.dataset.name);
</script>
</body>
</html>
